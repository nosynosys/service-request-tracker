<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Service Request Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }
    header {
      background: #173b69;
      color: white;
      padding: 48px 20px;
      text-align: center;
    }
    header p { max-width: 650px; margin: 12px auto 0; }
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 28px 20px;
    }
    h2 { color: #173b69; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
    }
    .card, form, .status-box {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .card h3 { margin-top: 0; }
    .tag {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 14px;
      font-weight: bold;
    }
    form {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }
    label { font-weight: bold; }
    input, select, button {
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font: inherit;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .status-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .status-buttons button { background: #64748b; }
    #message { min-height: 24px; font-weight: bold; }
    footer {
      text-align: center;
      padding: 24px;
      color: #475569;
    }
  </style>
</head>
<body>
  <header>
    <h1>Service Request Tracker</h1>
    <p>Track customer service requests and decide who needs a follow-up.</p>
  </header>

  <main>
    <section>
      <h2>Current Requests</h2>
      <div class="grid" id="request-list"></div>
    </section>

    <section>
      <h2>Add a Service Request</h2>
      <form id="request-form">
        <label for="customer">Customer name</label>
        <input id="customer" required placeholder="Jordan Smith" />

        <label for="title">Request title</label>
        <input id="title" required placeholder="Lawn mowing quote" />

        <label for="phone">Phone number</label>
        <input id="phone" required placeholder="555-123-4567" />

        <label for="status">Status</label>
        <select id="status">
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="scheduled">Scheduled</option>
        </select>

        <button type="submit">Add Request</button>
      </form>
    </section>

    <section>
      <h2>Demo States</h2>
      <div class="status-box">
        <div class="status-buttons">
          <button onclick="showMessage('Loading requests...')">Loading</button>
          <button onclick="showMessage('No requests found.')">Empty</button>
          <button onclick="showMessage('Error: Requests could not load.')">Error</button>
        </div>
        <p id="message">Sample requests are currently shown.</p>
      </div>
    </section>
  </main>

  <footer>Data Integration App Studio Capstone - Class 1</footer>

  <script>
    const requests = [
      {
        customer: "Jordan Smith",
        title: "Lawn mowing quote",
        phone: "555-123-4567",
        status: "new"
      },
      {
        customer: "Avery Lee",
        title: "Fence repair estimate",
        phone: "555-987-6543",
        status: "contacted"
      },
      {
        customer: "Morgan Davis",
        title: "Spring cleanup",
        phone: "555-555-0199",
        status: "scheduled"
      }
    ];

    function renderRequests() {
      const list = document.getElementById("request-list");
      list.innerHTML = requests.map(request => `
        <article class="card">
          <span class="tag">${request.status}</span>
          <h3>${request.title}</h3>
          <p><strong>Customer:</strong> ${request.customer}</p>
          <p><strong>Phone:</strong> ${request.phone}</p>
        </article>
      `).join("");
    }

    function showMessage(message) {
      document.getElementById("message").textContent = message;
    }

    document.getElementById("request-form").addEventListener("submit", event => {
      event.preventDefault();

      requests.unshift({
        customer: document.getElementById("customer").value,
        title: document.getElementById("title").value,
        phone: document.getElementById("phone").value,
        status: document.getElementById("status").value
      });

      renderRequests();
      event.target.reset();
      showMessage("New request added successfully.");
    });

    renderRequests();
  </script>
</body>
</html>
