<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Service Request Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }
    header {
      background: #173b69;
      color: white;
      padding: 40px 20px;
      text-align: center;
    }
    main { max-width: 1000px; margin: 0 auto; padding: 28px 20px; }
    h2 { color: #173b69; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
    }
    .card, form, .status-box, .auth-box {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .tag {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 14px;
      font-weight: bold;
    }
    form { display: grid; gap: 12px; }
    label { font-weight: bold; }
    input, select, button, textarea {
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font: inherit;
    }
    button { background: #2563eb; color: white; border: none; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .card-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .card-actions button { background: #64748b; font-size: 13px; padding: 6px 10px; }
    .card-actions button.delete { background: #dc2626; }
    #message { min-height: 24px; font-weight: bold; }
    #auth-status { font-weight: bold; }
    footer { text-align: center; padding: 24px; color: #475569; }

    .notes-toggle {
      background: #173b69;
      font-size: 13px;
      padding: 6px 10px;
      margin-top: 10px;
    }
    .notes-panel {
      margin-top: 14px;
      border-top: 1px solid #e2e8f0;
      padding-top: 12px;
      display: none;
    }
    .notes-panel.open { display: block; }
    .note-item {
      background: #f8fafc;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .note-item .note-meta {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }
    .notes-form { display: flex; gap: 8px; margin-top: 8px; }
    .notes-form textarea { flex: 1; min-height: 40px; resize: vertical; }
    .notes-status { font-size: 13px; color: #475569; min-height: 18px; margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>Service Request Tracker</h1>
    <p>Track customer service requests and decide who needs a follow-up.</p>
  </header>

  <main>
    <section class="auth-box" id="auth-section">
      <h2>Sign In</h2>
      <p id="auth-status">Not signed in.</p>
      <form id="signup-form">
        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="you@example.com" />
        <label for="password">Password</label>
        <input id="password" type="password" required placeholder="At least 6 characters" />
        <div style="display:flex; gap:10px;">
          <button type="submit">Sign In</button>
          <button type="button" id="signup-btn">Sign Up</button>
          <button type="button" id="signout-btn">Sign Out</button>
        </div>
      </form>
    </section>

    <section id="app-section" style="display:none;">
      <h2>Current Requests</h2>
      <div class="grid" id="request-list"></div>

      <h2>Add a Service Request</h2>
      <form id="request-form">
        <label for="customer">Customer name</label>
        <input id="customer" required placeholder="Jordan Smith" />
        <label for="title">Request title</label>
        <input id="title" required placeholder="Lawn mowing quote" />
        <label for="phone">Phone number</label>
        <input id="phone" required placeholder="555-123-4567" />
        <label for="status">Status</label>
        <select id="status">
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="scheduled">Scheduled</option>
        </select>
        <button type="submit">Add Request</button>
      </form>

      <div class="status-box">
        <p id="message"></p>
      </div>
    </section>
  </main>

  <footer>Data Integration App Studio Capstone - Class 3</footer>

  <script>
    const SUPABASE_URL = "https://uyxpovytvcmhcqxypclo.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_p3g3OYVkvz4ypMQaPLciYw_wKZOqXD9";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const BACKEND_URL = "https://service-request-tracker.vercel.app/api/activity-notes";

    const authSection = document.getElementById("auth-section");
    const appSection = document.getElementById("app-section");
    const authStatus = document.getElementById("auth-status");
    const messageEl = document.getElementById("message");

    function showMessage(msg) { messageEl.textContent = msg; }

    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        authStatus.textContent = `Signed in as ${session.user.email}`;
        appSection.style.display = "block";
        loadRequests();
      } else {
        authStatus.textContent = "Not signed in.";
        appSection.style.display = "none";
      }
    }

    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) { showMessage("Sign in error: " + error.message); return; }
      showMessage("Signed in.");
      checkSession();
    });

    document.getElementById("signup-btn").addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const { error } = await supabaseClient.auth.signUp({ email, password });
      if (error) { showMessage("Sign up error: " + error.message); return; }
      showMessage("Account created. Check email if confirmation is required, then sign in.");
    });

    document.getElementById("signout-btn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      showMessage("Signed out.");
      checkSession();
    });

    async function loadRequests() {
      showMessage("Loading requests...");
      const { data, error } = await supabaseClient
        .from("service_requests")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) { showMessage("Error: " + error.message); return; }
      if (!data || data.length === 0) { showMessage("No requests found."); }
      else { showMessage(""); }
      renderRequests(data || []);
    }

    function renderRequests(requests) {
      const list = document.getElementById("request-list");
      list.innerHTML = requests.map(r => `
        <article class="card">
          <span class="tag">${r.status}</span>
          <h3>${r.title}</h3>
          <p><strong>Customer:</strong> ${r.customer_name}</p>
          <p><strong>Phone:</strong> ${r.phone}</p>
          <div class="card-actions">
            <button onclick="updateStatus('${r.id}', 'new')">New</button>
            <button onclick="updateStatus('${r.id}', 'contacted')">Contacted</button>
            <button onclick="updateStatus('${r.id}', 'scheduled')">Scheduled</button>
            <button class="delete" onclick="deleteRequest('${r.id}')">Delete</button>
          </div>
          <button class="notes-toggle" onclick="toggleNotes('${r.id}')">Activity Notes</button>
          <div class="notes-panel" id="notes-panel-${r.id}">
            <div id="notes-list-${r.id}"></div>
            <div class="notes-form">
              <textarea id="notes-input-${r.id}" placeholder="Add a note..."></textarea>
              <button onclick="submitNote('${r.id}')">Add</button>
            </div>
            <p class="notes-status" id="notes-status-${r.id}"></p>
          </div>
        </article>
      `).join("");
    }

    async function updateStatus(id, status) {
      const { error } = await supabaseClient
        .from("service_requests")
        .update({ status })
        .eq("id", id);
      if (error) { showMessage("Error: " + error.message); return; }
      loadRequests();
    }

    async function deleteRequest(id) {
      const { error } = await supabaseClient
        .from("service_requests")
        .delete()
        .eq("id", id);
      if (error) { showMessage("Error: " + error.message); return; }
      loadRequests();
    }

    document.getElementById("request-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { showMessage("You must be signed in."); return; }

      const { error } = await supabaseClient.from("service_requests").insert({
        customer_name: document.getElementById("customer").value,
        title: document.getElementById("title").value,
        phone: document.getElementById("phone").value,
        status: document.getElementById("status").value,
        source: "form",
        user_id: session.user.id
      });

      if (error) { showMessage("Error: " + error.message); return; }
      e.target.reset();
      showMessage("Request added.");
      loadRequests();
    });

    // --- Activity Notes (MongoDB-backed feature) ---

    async function getAuthToken() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      return session ? session.access_token : null;
    }

    async function toggleNotes(requestId) {
      const panel = document.getElementById(`notes-panel-${requestId}`);
      const isOpen = panel.classList.contains("open");
      if (isOpen) {
        panel.classList.remove("open");
        return;
      }
      panel.classList.add("open");
      await loadNotes(requestId);
    }

    async function loadNotes(requestId) {
      const listEl = document.getElementById(`notes-list-${requestId}`);
      const statusEl = document.getElementById(`notes-status-${requestId}`);
      listEl.innerHTML = "";
      statusEl.textContent = "Loading notes...";

      const token = await getAuthToken();
      if (!token) {
        statusEl.textContent = "You must be signed in to view notes.";
        return;
      }

      try {
        const res = await fetch(`${BACKEND_URL}?app_record_id=${requestId}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const result = await res.json();

        if (!res.ok) {
          statusEl.textContent = "Error: " + (result.error || "Could not load notes.");
          return;
        }

        const notes = result.data || [];
        if (notes.length === 0) {
          statusEl.textContent = "No notes yet.";
        } else {
          statusEl.textContent = "";
          listEl.innerHTML = notes.map(n => `
            <div class="note-item">
              <div>${escapeHtml(n.payload && n.payload.text ? n.payload.text : "")}</div>
              <div class="note-meta">${new Date(n.received_at).toLocaleString()}</div>
            </div>
          `).join("");
        }
      } catch (err) {
        statusEl.textContent = "Error: could not reach the server.";
      }
    }

    async function submitNote(requestId) {
      const input = document.getElementById(`notes-input-${requestId}`);
      const statusEl = document.getElementById(`notes-status-${requestId}`);
      const text = input.value.trim();

      if (!text) {
        statusEl.textContent = "Note cannot be empty.";
        return;
      }

      const token = await getAuthToken();
      if (!token) {
        statusEl.textContent = "You must be signed in to add notes.";
        return;
      }

      statusEl.textContent = "Saving note...";

      try {
        const res = await fetch(BACKEND_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({ app_record_id: String(requestId), text })
        });
        const result = await res.json();

        if (!res.ok) {
          statusEl.textContent = "Error: " + (result.error || "Could not save note.");
          return;
        }

        input.value = "";
        statusEl.textContent = "Note added.";
        loadNotes(requestId);
      } catch (err) {
        statusEl.textContent = "Error: could not reach the server.";
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    checkSession();
  </script>
</body>
</html>
